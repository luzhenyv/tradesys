# tradesys 配置
#
# 每个参数的含义、状态（已裁决 / source / 默认值）与来源，见 docs/rules_spec.md §6。
# 本文件的分组与顺序和 §6 表格一一对应；行尾注释是使用该参数的规则 ID，
# 规则详情在 rules_spec 中按 ID 查找。

veto:
  min_rr: 1.0              # V14
  preferred_rr: 1.5        # V14
  max_stop_pct: 0.10       # V05
  disabled: []             # 实验时关闭的规则 ID，如 [V11]（AF §17）
universe:
  min_market_cap: 5.0e9    # V10
recent:
  lookback_days: 20        # P-NEWLOW / P-NEWHIGH
  break_days: 2            # V02, V03
volume:
  shrink_ratio: 1.0        # P-VOL
  expand_ratio: 1.0        # P-VOL
rsi:
  periods: [6, 24]         # P-RSI
stop:
  buffer_pct: 0.01         # 所有 Setup
band68:
  max_strike_gap_pct: 0.02 # P-BAND68
  expiry: monthly          # P-BAND68
swing:
  k: 2                     # P-SWING
divergence:
  max_gap_days: 30         # P-DIVERGENCE
candle:
  short_shadow_ratio: 0.1  # P-CANDLE
v07:
  earnings_window_days: 2  # V07
  min_drop_pct: 0.03       # V07
v08:
