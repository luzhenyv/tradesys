v16:
  rsi_overbought: 80       # V16
s01:
  lookback_days: 20        # S01
s02:
  lookback_days: 20        # S02
  near_line_pct: 0.03      # S02
s04:
  lookback_days: 20        # S04
  touch_pct: 0.02          # S04
s05:
  min_streak: 5            # S05
s06:
