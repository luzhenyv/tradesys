[project]
name = "tradesys"
version = "0.1.0"
description = "Personal trading methodology as testable rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "yfinance>=1.7.0",
]

[project.scripts]
tradesys = "tradesys.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradesys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 需要访问 Yahoo Finance，默认跳过；用 -m network 运行"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
